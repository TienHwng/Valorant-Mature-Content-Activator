name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ValorantMatureContentManager.sln
      - name: Verify formatting
        run: dotnet format ValorantMatureContentManager.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ValorantMatureContentManager.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ValorantMatureContentManager.sln --configuration Release --no-build